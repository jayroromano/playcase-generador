<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playcase · demo del padre (simula Shopify)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:#f4f4f6;color:#17171c}
  header{padding:16px 22px;background:#101014;color:#fff}
  header b{color:#17b04a}
  main{max-width:1000px;margin:0 auto;padding:20px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{padding:9px 12px;border-radius:8px;border:1px solid #cfcfd6;background:#fff;font-weight:600;cursor:pointer}
  button:hover{border-color:#17b04a}
  iframe{width:100%;height:720px;border:1px solid #cfcfd6;border-radius:12px;background:#101014}
  pre{background:#101014;color:#b9f5cb;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5;max-height:280px}
  p{line-height:1.6;font-size:14px}
  code{background:#e8e8ee;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header><b>PLAYCASE</b> · demo del padre (simula Shopify)</header>
<main>
  <p>
    Esta página hace de <code>window.parent</code>. El iframe carga el generador en modo cliente.
    Debe estar abierta desde <code>http://localhost:4173/parent-demo</code> para que el origen coincida
    con el que autoriza el servidor local.
  </p>
  <div class="bar">
    <button id="btnInit">Enviar playcase:init</button>
    <button id="btnPing">Enviar playcase:ping</button>
    <button id="btnReload">Recargar iframe</button>
  </div>
  <iframe id="frame" src="/?modo=cliente" title="Playcase"></iframe>
  <h3>Mensajes recibidos</h3>
  <pre id="log">Esperando mensajes…</pre>
</main>
<script>
  const ORIGEN = location.origin;
  const frame = document.getElementById('frame');
  const log = document.getElementById('log');
  const lineas = [];

  function pintar(texto) {
    lineas.push(new Date().toLocaleTimeString() + '  ' + texto);
    log.textContent = lineas.join('\n');
    log.scrollTop = log.scrollHeight;
  }

  function enviar(tipo) {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: tipo }, ORIGEN);
    pintar('→ ' + tipo + ' (destino ' + ORIGEN + ')');
  }

  window.addEventListener('message', event => {
    if (event.origin !== ORIGEN) {
      pintar('IGNORADO origen no permitido: ' + event.origin);
      return;
    }
    const data = event.data;
    if (!data || typeof data !== 'object' || typeof data.type !== 'string') {
      pintar('IGNORADO mensaje con formato desconocido');
      return;
    }
    pintar('← ' + data.type + '  ' + JSON.stringify(data));
  });

  frame.addEventListener('load', () => setTimeout(() => enviar('playcase:init'), 300));
  document.getElementById('btnInit').onclick = () => enviar('playcase:init');
  document.getElementById('btnPing').onclick = () => enviar('playcase:ping');
  document.getElementById('btnReload').onclick = () => {
    lineas.length = 0;
    log.textContent = 'Esperando mensajes…';
    frame.src = '/?modo=cliente&t=' + Date.now();
  };
</script>
</body>
</html>
